<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Портфолио Фронтенд Разработчика</title>
    <style>
      /* Базовые сбросы и переменные */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #121212;
        color: #fff;
        line-height: 1.6;
        padding-top: 70px; /* Отступ сверху, чтобы хедер не перекрывал контент */
      }
      h1,
      h2 {
        margin-bottom: 20px;
      }
      section {
        padding: 40px 20px;
      }

      /* --- СТИЛИ ХЕДЕРА (По умолчанию для мобилок) --- */
      .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: #1a1a1a;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid #333;
        z-index: 1000;
      }
      .logo {
        font-weight: bold;
        font-size: 1.2rem;
        color: #00adb5;
      }

      /* Кнопка Бургер */
      .burger-btn {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 1001;
      }
      .burger-btn span {
        display: block;
        width: 25px;
        height: 3px;
        background: #fff;
        transition: 0.3s;
      }

      /* Выпадающее мобильное меню */
      .nav-menu {
        position: fixed;
        top: -100%; /* Изначально спрятано вверху */
        left: 0;
        width: 100%;
        background: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 30px 0;
        transition: 0.4s ease-in-out;
        border-bottom: 1px solid #333;
      }
      .nav-menu.active {
        top: 60px; /* Показывается сразу под хедером */
      }
      .nav-menu a {
        color: #fff;
        text-decoration: none;
        font-size: 1.1rem;
      }

      /* --- СТИЛИ ДЛЯ КОНТЕНТА --- */
      .hero {
        text-align: center;
      }
      .hero h1 {
        font-size: 2rem;
      }
      .hero p {
        color: #aaa;
      }

      .projects-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      .project-card {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #333;
      }

      /* --- АДАПТИВ ДЛЯ БОЛЬШИХ ЭКРАНОВ (Планшеты и ПК) --- */
      @media (min-width: 768px) {
        body {
          padding-top: 80px;
        }
        section {
          padding: 40px;
        }

        /* Прячем бургер на больших экранах */
        .burger-btn {
          display: none;
        }

        /* Превращаем выпадающее меню в горизонтальную строку */
        .nav-menu {
          position: static;
          flex-direction: row;
          width: auto;
          padding: 0;
          background: none;
          border-bottom: none;
        }
        .nav-menu a:hover {
          color: #00adb5;
        }

        /* Сетка контента */
        .hero {
          text-align: left;
        }
        .hero h1 {
          font-size: 3rem;
        }
        .projects-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1024px) {
        .projects-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- Шапка сайта -->
    <header class="header">
      <div class="logo">DevPortfolio</div>

      <!-- Кнопка гамбургера для мобилок -->
      <button class="burger-btn" id="burgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Навигация -->
      <nav class="nav-menu" id="navMenu">
        <a href="#about">О себе</a>
        <a href="#projects">Проекты</a>
        <a href="#contacts">Контакты</a>
      </nav>
    </header>

    <!-- Секция О себе -->
    <section class="hero" id="about">
      <h1>Привет, я Фронтенд Разработчик</h1>
      <p>Создаю адаптивные и быстрые сайты для любых устройств.</p>
    </section>

    <!-- Секция Проекты -->
    <section id="projects">
      <h2>Мои проекты</h2>
      <div class="projects-grid">
        <div class="project-card">
          <h3>Проект 1</h3>
          <p>Описание адаптивного интернет-магазина.</p>
        </div>
        <div class="project-card">
          <h3>Проект 2</h3>
          <p>Интерфейс личного кабинета (React).</p>
        </div>
        <div class="project-card">
          <h3>Проект 3</h3>
          <p>Лендинг с анимациями (CSS Grid).</p>
        </div>
      </div>
    </section>

    <!-- Логика работы бургера -->
    <script>
      const burgerBtn = document.getElementById('burgerBtn');
      const navMenu = document.getElementById('navMenu');

      burgerBtn.addEventListener('click', () => {
        navMenu.classList.toggle('active');
      });

      // Закрываем меню при клике на любую ссылку (актуально для мобилок)
      document.querySelectorAll('.nav-menu a').forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('active');
        });
      });
    </script>
  </body>
</html>
